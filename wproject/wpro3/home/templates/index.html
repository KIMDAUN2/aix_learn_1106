<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Document</title>
    <script>
        function sendBtn(){
            const send_data =$('#data').val();
            console.log('데이터 : '+send_data);

            $.ajax({
                url:'/ajax_data/',
                type:'post',
                headers:{'X-CSRFToken':'{{csrf_token}}'},
                data:{'data':send_data},
                dataType:'json',
                success:function(data){
                    alert('예측 데이터를 가져옵니다. 성공');
                    console.log(data)
                    $('#input_data').text(send_data);
                    $('#result').text(data.result_data);
                    $('#result2').text(data.result2);
                    $('#result3').text(data.result3); 

                    const ctx = document.getElementById('myChart');
                    let chartStatus = Chart.getChart('myChart')
                    if(chartStatus != undefined){
                        chartStatus.destroy();   //리셋
                }
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                        labels: ['레드와인','화이트와인'],
                        datasets: [{
                            label: '와인 확률',
                            data: [data.result2],       // 확률 7개
                            borderWidth: 1,
                            // barThickness:50
                        }]
                        },
                        options: {
                        scales: {
                            y: {
                            beginAtZero: true,
                            }
                        }
                        }
                    });
                },
                fail:function(){
                    alert('예측하는데 오류가 발생했습니다. 다시 시도해주세요.')
                }
            })
            }
    </script>
</head>
<body>
    <h1>메인페이지</h1>
    <div>
        <label> 알코올,당도, pH (9.4,1.9,3.51)</label><br/>
        <input type = 'text' name='data' id='data'>
        <button type ='button' onclick = 'sendBtn()'>예측</button>
        <br>
        <br>
        <div>입력데이터:<span id='input_data'>데이터입력필요</span></div>
        <div>예측결과:<span id='result'>?</span></div>
        <div>레드와인 확률:<span id='result2'>?</span></div>
        <div>화이트와인 확률:<span id='result3'>?</span></div>
    </div>

    <!--차트그래프-->
    <div>
    <canvas id="myChart"></canvas>
    </div>
    <!--차트그래프-->

</body>
</html>
